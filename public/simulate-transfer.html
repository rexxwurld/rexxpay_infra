<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RexxPay — Simulate Transfer</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Inter, Arial, sans-serif;
      background: #f5f9ff;
      color: #10233f;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: #fff;
      border: 1px solid #e2eaf4;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 12px 40px rgba(20, 60, 100, 0.08);
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #718096;
      font-size: 14px;
      margin-bottom: 26px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin: 16px 0 8px;
    }

    input {
      width: 100%;
      height: 50px;
      border: 1px solid #d9e2ee;
      border-radius: 12px;
      padding: 0 14px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #1677ff;
      box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.1);
    }

    button {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 12px;
      margin-top: 22px;
      background: #1677ff;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    .status {
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      display: none;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      display: block;
      background: #ecfdf3;
      color: #087443;
    }

    .error {
      display: block;
      background: #fff1f2;
      color: #b42318;
    }

    .note {
      margin-top: 20px;
      font-size: 12px;
      line-height: 1.5;
      color: #7b8798;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">RexxPay</div>
    <div class="subtitle">Development Payment Simulator</div>

    <form id="simulateForm">
      <label for="accountNumber">Account Number</label>
      <input
        id="accountNumber"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        placeholder="Enter checkout account number"
        required
      >

      <label for="amount">Amount (₦)</label>
      <input
        id="amount"
        type="number"
        min="1"
        step="0.01"
        inputmode="decimal"
        placeholder="5000"
        required
      >

      <button id="payButton" type="submit">
        Simulate Payment
      </button>
    </form>

    <div id="status" class="status"></div>

    <div class="note">
      Development/testing only. This sends a simulated bank transfer to
      RexxPay's existing mock-bank endpoint. Disable/remove this page before
      production.
    </div>
  </main>

  <script src="/js/simulate-transfer.js"></script>
</body>
</html>
